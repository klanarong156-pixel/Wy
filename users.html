<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Farm · Users</title><link rel="stylesheet" href="style.css?v=one-tap-all-1"></head><body class="one-tap-page"><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">SF</span><div><b>Smart Farm</b><small>ACCESS CONTROL</small></div></div><nav><a href="index.html"><span>◈</span>ภาพรวม</a><a href="analytics.html"><span>⌁</span>ประวัติเซ็นเซอร์</a><a href="reports.html"><span>▦</span>รายงานสรุป</a><a href="schedule.html"><span>◷</span>ตั้งค่าอัตโนมัติ</a><a href="users.html"><span>♙</span>ผู้ใช้และสิทธิ์</a></nav></aside><main class="workspace"><header class="topbar"><div class="mobile-brand">ผู้ใช้และสิทธิ์</div><div class="top-actions"><button id="logout" class="settings-button">ออกจากระบบ</button></div></header><section class="hero compact"><div><p class="eyebrow">ACCESS CONTROL / USERS</p><h1>ผู้ใช้และสิทธิ์</h1><p class="muted">กำหนดว่าใครดูข้อมูลหรือสั่งงานรีเลย์ได้</p></div></section><section class="panel"><div class="panel-head"><div><h2>รายชื่อผู้ใช้งาน</h2><p class="muted tiny">แก้ role แล้วกดบันทึกเพื่ออัปเดต Firestore</p></div></div><div id="users" class="user-list"></div><pre id="message">กำลังโหลด...</pre></section></main></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=1"></script><script src="auth.js?v=1"></script><script>SmartFarmAccess.start().then(async()=>{if(!SmartFarmAccess.configured()||!SmartFarmAccess.can('admin'))return message.textContent='ต้องเป็น admin หรือ owner และต้องตั้งค่า Firebase ก่อน';const snap=await firebase.firestore().collection('users').get();users.innerHTML=snap.docs.map(d=>{const u=d.data();return `<div class="user-row"><div><b>${u.email||d.id}</b><small>${d.id}</small></div><select data-uid="${d.id}"><option ${u.role==='viewer'?'selected':''}>viewer</option><option ${u.role==='operator'?'selected':''}>operator</option><option ${u.role==='admin'?'selected':''}>admin</option><option ${u.role==='owner'?'selected':''}>owner</option></select><button data-save="${d.id}" class="save-button">บันทึก</button></div>`}).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const role=document.querySelector(`[data-uid="${b.dataset.save}"]`).value;await firebase.firestore().collection('users').doc(b.dataset.save).update({role});message.textContent='บันทึกสิทธิ์แล้ว'});});logout.onclick=()=>SmartFarmAccess.signOut().then(()=>location.href='auth.html');</script></body></html>
