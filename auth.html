<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Farm · Login</title><link rel="stylesheet" href="style.css?v=one-tap-all-1"></head><body class="one-tap-page"><main class="auth-shell"><section class="auth-card"><div class="brand"><span class="brand-mark">SF</span><div><b>Smart Farm</b><small>SECURE ACCESS</small></div></div><p class="eyebrow">WELCOME BACK</p><h1>เข้าสู่ระบบ</h1><p class="muted">ลงชื่อเข้าใช้เพื่อควบคุมอุปกรณ์ในฟาร์ม</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="save-button" type="submit">เข้าสู่ระบบ</button></form><p id="message" class="auth-message"></p><p class="muted auth-note">ผู้ดูแลระบบต้องเปิดใช้งาน Firebase Authentication และกำหนดสิทธิ์ใน Firestore ก่อนใช้งานจริง</p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=1"></script><script src="auth.js?v=1"></script><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message');try{if(!SmartFarmAccess.configured())throw Error('ยังไม่ได้ตั้งค่า Firebase ใน firebase-config.js');await firebase.auth().signInWithEmailAndPassword(email.value,password.value);location.href='index.html';}catch(x){m.textContent=x.message||'เข้าสู่ระบบไม่สำเร็จ';}};</script></body></html>
